<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Main</title>
</head>
<style>
	* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Kumbh Sans', sans-serif;
}
body{
	animation-delay: 1s;
    margin: 0;
    margin-top: 230px;
    min-height: 100vh;
    background-image: url(image/bg.jpg);
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
  }

.mainst{
	
	display: flex;
	align-items: center;
	justify-content: center;
	color: white;
	font-size: 30px;
	margin-left: 30px;
	margin-right: 30px;
	animation-name: eto;
}

.aaa{
	
	display: flex;
	align-items: center;
	justify-content: center;
	color: white;


	
}
.get{
	margin-top: 70px;
	display: flex;
	align-items: center;
	justify-content: center;
	color: white;
	animation-delay: 1s;


}
.get a{
	font-size: 30px;
	padding-left: 20px;
	padding-right: 20px;
	text-decoration: none;
	color: white;
	transition: all 0.4s ease-in-out;
	border-radius: 20px;
	animation-delay: 1s;

}
.get a:hover{
	 background-color: rgba(255, 255, 255, 0.5);
	 color: black;
}
@keyframes eto{
	0%{
		transform: translate(0px, 0px);
	}
	100%{
		transform: translate(10px, 100px);
	}
}
@keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .delayed-text {
      /* Prevents text from flashing on screen before animation starts */
      opacity: 0; 

      /* Key properties */
      animation-name: fadeIn;
      animation-duration: 0.8s;
      animation-delay: 1s; /* <--- 1 SECOND DELAY HERE */
      animation-fill-mode: forwards; /* Holds the final 'opacity: 1' state */
    }
</style>
<body>

 	<div class="delayed-text">
  <div class="mainst">
  	 <h1> A WEBSITE FOR BEGINNERS</h1>
  	   </div>
  	 <h3 class="aaa">microsoft office tutorial</h3>
  <div class="get">
  	<a href="home.html">Get started</a>
  </div>
 </div>




  <script>
  	const menuToggle = document.querySelector('.navbar__toggle');
const navMenu = document.querySelector('.navbar__menu');

menuToggle.addEventListener('click', () => {
  menuToggle.classList.toggle('active');
  navMenu.classList.toggle('active');
});
  </script>
</body>
</html>
